openapi: 3.0.3
info:
  title: ml api adapter API Documentation
  version: "1.1"
tags: []
paths:
  /endpointcache:
    delete:
      description: The HTTP request DELETE /endpointcache is used to reset the
        endpoint cache by performing an stopCache and initializeCache the Admin
        API.
      summary: Endpoint Cache
      tags:
        - cache
      operationId: EndpointCache
      parameters:
        - name: date
          in: header
          required: true
          schema:
            type: string
      responses:
        default:
          description: Successful
          content:
            "*/*":
              schema:
                type: string
  /health:
    get:
      summary: Status of adapter
      operationId: getHealth
      tags:
        - health
      responses:
        default:
          description: Successful
          content:
            "*/*":
              schema:
                type: string
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      operationId: getMetrics
      tags:
        - metrics
      responses:
        default:
          description: Successful
          content:
            "*/*":
              schema:
                type: string
  /bulkTransfers/{id}:
    get:
      summary: Get a bulk transfer by Id
      operationId: getBulkTransfersId
      parameters:
        - name: accept
          in: header
          required: false
          schema:
            type: string
            pattern: application\/vnd.interoperability[.]
        - name: content-type
          in: header
          required: true
          schema:
            type: string
            pattern: application\/vnd.interoperability[.]
        - name: date
          in: header
          required: true
          schema:
            type: string
        - name: x-forwarded-for
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-source
          in: header
          required: true
          schema:
            type: string
        - name: fspiop-destination
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-encryption
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-signature
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-uri
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-http-method
          in: header
          required: false
          schema:
            type: string
        - description: path
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-7][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$|^[0-9A-HJKMNP-TV-Z]{26}$"
      tags:
        - bulk-transfers
        - sampled
      responses:
        default:
          description: Successful
          content:
            "*/*":
              schema:
                type: string
    put:
      summary: BulkTransfersByIDPut
      operationId: BulkTransfersByIDPut
      parameters:
        - name: content-type
          in: header
          required: true
          schema:
            type: string
            pattern: application\/vnd.interoperability[.]
        - name: date
          in: header
          required: true
          schema:
            type: string
        - name: x-forwarded-for
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-source
          in: header
          required: true
          schema:
            type: string
        - name: fspiop-destination
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-encryption
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-signature
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-uri
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-http-method
          in: header
          required: false
          schema:
            type: string
        - description: path
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTransfersIDPutResponse"
      tags:
        - bulkTransfers
      responses:
        default:
          description: The callback PUT /bulkTransfers/<ID> is used to inform the client
            of a requested or created bulk transfer. The <ID> in the URI should
            contain the bulkTransferId that was used for the creation of the
            bulk transfer (POST /bulkTransfers), or the <ID> that was used in
            the GET /bulkTransfers/<ID>.
          content:
            "*/*":
              schema:
                type: string
  /bulkTransfers:
    post:
      summary: Transfer API.
      operationId: postBulkTransfers
      parameters:
        - name: accept
          in: header
          required: false
          schema:
            type: string
            pattern: application\/vnd.interoperability[.]
        - name: content-type
          in: header
          required: true
          schema:
            type: string
            pattern: application\/vnd.interoperability[.]
        - name: content-length
          in: header
          schema:
            type: number
            maximum: 5242880
        - name: date
          in: header
          required: true
          schema:
            type: string
        - name: x-forwarded-for
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-source
          in: header
          required: true
          schema:
            type: string
        - name: fspiop-destination
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-encryption
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-signature
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-uri
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-http-method
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTransfersPostRequest"
      tags:
        - bulk-transfers
      responses:
        default:
          description: Successful
          content:
            "*/*":
              schema:
                type: string
  /bulkTransfers/{id}/error:
    put:
      summary: BulkTransfersErrorByIDPut
      operationId: BulkTransfersErrorByIDPut
      parameters:
        - name: content-type
          in: header
          required: true
          schema:
            type: string
            pattern: application\/vnd.interoperability[.]
        - name: date
          in: header
          required: true
          schema:
            type: string
        - name: x-forwarded-for
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-source
          in: header
          required: true
          schema:
            type: string
        - name: fspiop-destination
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-encryption
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-signature
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-uri
          in: header
          required: false
          schema:
            type: string
        - name: fspiop-http-method
          in: header
          required: false
          schema:
            type: string
        - description: path
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
        required: true
      tags:
        - bulkTransfersError
      responses:
        default:
          description: If the server is unable to find or create a bulk transfer, or
            another processing error occurs, the error callback PUT
            /bulkTransfers/<ID>/error is used. The <id> in the URI should
            contain the bulkTransferId that was used for the creation request of
            the bulk transfer (POST /bulkTransfers), or the <ID> that was used
            in the GET /bulkTransfers/<ID>.
          content:
            "*/*":
              schema:
                type: string
servers:
  - url: http://test-ml-api-adapter.mojaloop.live
components:
  schemas:
    Amount:
      type: object
      description: Amount of the transfer
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        amount:
          type: string
          description: Amount of the transfer
          pattern: ^([0]|([1-9][0-9]{0,17}))([.][0-9]{0,3}[1-9])?$
      required:
        - currency
        - amount
    Currency:
      title: Currency
      description: The currency codes defined in ISO 4217 as three-letter alphabetic
        codes are used as the standard naming representation for currencies.
      type: string
      minLength: 3
      maxLength: 3
      enum:
        - AED
        - AFN
        - ALL
