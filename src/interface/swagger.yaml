    ExtensionModel:
      type: object
      properties:
        key:
          type: string
          description: Key
          minLength: 1
          maxLength: 32
        value:
          type: string
          description: Value
          minLength: 1
          maxLength: 128
      required:
        - key
        - value
    Extension:
      type: array
      description: extension
      minItems: 1
      maxItems: 16
      items:
        $ref: "#/components/schemas/ExtensionModel"
    ExtensionList:
      type: object
      description: Extension list
      properties:
        extension:
          $ref: "#/components/schemas/Extension"
      required:
        - extension
    IndividualTransfer:
      type: object
      properties:
        transferId:
          type: string
          description: Id of transfer
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-7][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$|^[0-9A-HJKMNP-TV-Z]{26}$"
        transferAmount:
          $ref: "#/components/schemas/Amount"
        ilpPacket:
          type: string
          description: ilp packet
          minLength: 1
          maxLength: 32768
          pattern: ^[A-Za-z0-9-_]+[=]{0,2}$
        condition:
          type: string
          description: Condition of transfer
          maxLength: 48
          pattern: ^[A-Za-z0-9-_]{43}$
        extensionList:
          type: object
          description: Extension list
          properties:
            extension:
              type: array
              description: extension
              minItems: 1
              maxItems: 16
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: Key
                    minLength: 1
                    maxLength: 32
                  value:
                    type: string
                    description: Value
                    minLength: 1
                    maxLength: 128
                required:
                  - key
                  - value
          required:
            - extension
      required:
        - transferId
        - transferAmount
        - ilpPacket
        - condition
    IndividualTransferResult:
      title: IndividualTransferResult
      type: object
      description: Data model for the complex type IndividualTransferResult.
      properties:
        transferId:
          type: string
          description: Identifies messages related to the same /transfers sequence.
        fulfilment:
          type: string
          description: Fulfilment of the condition specified with the transaction. Note -
            Either fulfilment or errorInformation should be set, not both.
        errorInformation:
          $ref: "#/components/schemas/ErrorInformation"
        extensionList:
          $ref: "#/components/schemas/ExtensionList"
      required:
        - transferId
    ErrorInformation:
      type: object
      description: Error information
      properties:
        errorDescription:
          type: string
        errorCode:
          type: string
          pattern: ^[0-9]{4}
        extensionList:
          $ref: "#/components/schemas/ExtensionList"
      required:
        - errorDescription
        - errorCode
    Error:
      type: object
      properties:
        errorInformation:
          $ref: "#/components/schemas/ErrorInformation"
      required:
        - errorInformation
    BulkTransfersPostRequest:
      type: object
      properties:
        bulkTransferId:
          type: string
          description: Id of bulk transfers
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-7][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$|^[0-9A-HJKMNP-TV-Z]{26}$"
        bulkQuoteId:
          type: string
          description: Id of bulk quote
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-7][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$|^[0-9A-HJKMNP-TV-Z]{26}$"
        payeeFsp:
          type: string
          description: Financial Service Provider of Payee
          minLength: 1
          maxLength: 32
        payerFsp:
          type: string
          description: Financial Service Provider of Payer
          minLength: 1
          maxLength: 32
        extensionList:
          $ref: "#/components/schemas/ExtensionList"
        expiration:
          type: string
          description: When the transfer expires
          pattern: ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:(\.\d{3}))(?:Z|[+-][01]\d:[0-5]\d)$
        individualTransfers:
          type: array
          description: individual transfers list
          minItems: 1
          items:
            $ref: "#/components/schemas/IndividualTransfer"
      required:
        - bulkTransferId
        - bulkQuoteId
        - payerFsp
        - payeeFsp
        - individualTransfers
        - expiration
    BulkTransfersIDPutResponse:
      type: object
      properties:
        completedTimestamp:
          type: string
          description: Time and date when the bulk transaction was completed.
        individualTransferResults:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/IndividualTransferResult"
          description: List of IndividualTransferResult elements.
        bulkTransferState:
          type: string
          description: The state of the bulk transfer.
        extensionList:
          $ref: "#/components/schemas/ExtensionList"
      required:
        - bulkTransferState
